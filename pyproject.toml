[project]
name = "beacon-data-structure"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "marimo>=0.25.0",
    "matplotlib>=3.11.2",
    "polars>=1.44.2",
    "seaborn>=0.13.2",
]

[tool.pylint]
disable = [
    "W1203",  # Use lazy % formatting in logging functions
    "W0511",  # Fixme comments
]
[tool.pylint.main]
ignore=[".venv"]
# Anchor module resolution at the repo root so relative imports in src/
# resolve correctly when pylint lints a single file in isolation (as the
# VS Code Pylint extension does).
source-roots=["."]

[tool.ty.environment]
# src is a package (has __init__.py), not a src-layout root, so only the
# project root should be searched for first-party modules.
root = ["."]

[tool.pytest.ini_options]
# tests/ has no __init__.py, so pytest would otherwise add tests/ itself to
# sys.path instead of the repo root, breaking `from src...` imports.
pythonpath = ["."]

[dependency-groups]
dev = [
    "pylint>=4.0.9",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
